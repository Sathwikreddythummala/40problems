<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reverse Records</title>
    <style>
		body {
		    font-family: Arial, sans-serif;
		    background: linear-gradient(135deg, #d2ffff, #0694c6);
		    margin: 0;
		    padding: 0;
		}

		h2 {
		    text-align: center;
		    margin-top: 20px;
		    color: #fff;
		    font-size: 28px;
		}

		div {
		    text-align: center;
		    margin: 20px 0;
		}

		label {
		    font-weight: bold;
		    font-size: 16px;
		    color: #fff;
		    margin-right: 8px;
		}

		input[type="text"] {
		    padding: 8px 12px;
		    width: 250px;
		    border-radius: 6px;
		    border: 1px solid #ccc;
		    outline: none;
		    font-size: 14px;
		    transition: 0.3s;
		}

		input[type="text"]:focus {
		    border-color: #0694c6;
		    box-shadow: 0 0 5px rgba(6, 148, 198, 0.5);
		}

		input[type="button"] {
		    padding: 8px 15px;
		    margin-left: 10px;
		    background-color: #0694c6;
		    color: white;
		    border: none;
		    border-radius: 6px;
		    font-size: 14px;
		    cursor: pointer;
		    transition: 0.3s;
		}

		input[type="button"]:hover {
		    background-color: #057ba5;
		}

		table {
		    width: 80%;
		    border-collapse: collapse;
		    margin: 20px auto;
		    background: white;
		    border-radius: 8px;
		    overflow: hidden;
		    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
		}

		th, td {
		    padding: 12px;
		    border-bottom: 1px solid #eee;
		    text-align: center;
		    font-size: 14px;
		}

		th {
		    background-color: #0694c6;
		    color: white;
		    font-size: 15px;
		}

		tr:hover {
		    background-color: #f1faff;
		}

		button {
		    padding: 6px 12px;
		    margin: 2px;
		    cursor: pointer;
		    border-radius: 4px;
		    font-size: 13px;
		    border: none;
		    transition: 0.3s;
		}

		.edit-btn {
		    background-color: #4CAF50;
		    color: white;
		}

		.edit-btn:hover {
		    background-color: #3e9142;
		}

		.delete-btn {
		    background-color: #f44336;
		    color: white;
		}

		.delete-btn:hover {
		    background-color: #d9362a;
		}

		
		
    </style>
</head>
<body>

<h2 style="text-align:center;">Reverse Records</h2>

<div>
	<label>String :- </label>
	<input id="addString" type="text" placeholder="please enter a String" name="username">
	<input id="Submit" type="button" value="add a string"></input
</div>

<table id="reverseTable">
    <thead>
        <tr>
            <th>ID</th>
            <th>Input</th>
            <th>Output</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <!-- Data will load here -->
    </tbody>
</table>

<script>
    const apiUrl = "http://localhost:9090/reverse"; // change if needed
	
	
	
	document.getElementById("Submit").addEventListener("click", function () {
	        const inputValue = document.getElementById("addString").value.trim();

	        if (inputValue === "") {
	            alert("Please enter a string.");
	            return;
	        }

	        fetch(apiUrl, {
	            method: "POST",
	            headers: { "Content-Type": "application/json" },
	            body: JSON.stringify({ input: inputValue })
	        })
	        .then(res => res.text())
	        .then(() => {
	            location.reload(); // reload full page after success
	        })
	        .catch(err => {
	            console.error("Error:", err);
	            alert("Something went wrong. Please try again.");
	        });
	    });
		
		
    // Load table data
    function loadTable() {
        fetch(apiUrl)
            .then(res => res.json())
            .then(data => {
                const tbody = document.querySelector("#reverseTable tbody");
                tbody.innerHTML = "";
                data.forEach(record => {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${record.id}</td>
                        <td>${record.input}</td>
                        <td>${record.output}</td>
                        <td>
                            <button class="edit-btn" onclick="editRecord(${record.id}, '${record.input}')">Edit</button>
                            <button class="delete-btn" onclick="deleteRecord(${record.id})">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            });
    }

    // Delete record
    function deleteRecord(id) {
        if (confirm("Are you sure you want to delete this record?")) {
            fetch(apiUrl, {
                method: "DELETE",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id: id })
            })
            .then(res => res.text())
            .then(msg => {
                alert(msg);
                loadTable();
            });
        }
    }

    // Edit record
    function editRecord(id, oldInput) {
        const newInput = prompt("Enter new input value:", oldInput);
        if (newInput !== null && newInput.trim() !== "") {
            fetch(apiUrl,{
			method: "PUT",
			headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: id, input: newInput })
            })
            .then(res => res.text())
            .then(msg => {
                alert(msg);
                loadTable();
            });
        }
    }

    // Initial load
    loadTable();
</script>

</body>
</html>
