<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IsPrime Manager</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298); /* Changed BG color */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 95%;
            max-width: 1100px;
            text-align: center;
        }

        h1 {
            color: white;
            text-shadow: 0px 0px 10px rgba(0,0,0,0.4);
            margin-bottom: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 20px;
            margin: 15px 0;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0px 4px 25px rgba(0,0,0,0.25);
        }

        .card h2 {
            color: #fff;
            margin-bottom: 15px;
        }

        input {
            padding: 10px;
            border: none;
            border-radius: 10px;
            outline: none;
            margin: 5px;
            width: 200px;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.25);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin: 2px;
        }

        button:hover {
            background: rgba(255,255,255,0.45);
        }

        table {
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
            color: white;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.3);
            text-align: center;
        }

        #primeResult {
            color: yellow;
            margin-top: 10px;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .edit-btn {
            background: rgba(0, 200, 0, 0.4);
        }

        .edit-btn:hover {
            background: rgba(0, 200, 0, 0.6);
        }

        .delete-btn {
            background: rgba(200, 0, 0, 0.4);
        }

        .delete-btn:hover {
            background: rgba(200, 0, 0, 0.6);
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🔢 Prime Number Manager</h1>

    <!-- Post Check -->
    <div class="card">
        <h2>Check Prime & Save</h2>
        <input type="number" id="primeInput" placeholder="Enter a number">
        <button onclick="checkPrime()">Check & Save</button>
        <p id="primeResult"></p>
    </div>

    <!-- Get Records -->
    <div class="card">
        <h2>All Records</h2>
        <button onclick="getRecords()">Refresh Records</button>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Input</th>
                <th>Output</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="recordsTable"></tbody>
        </table>
    </div>
</div>

<script>
    const apiUrl = "/isPrime";

    // POST: Check Prime & Save
    async function checkPrime() {
        const num = document.getElementById("primeInput").value;
        if (!num) {
            alert("Enter a number!");
            return;
        }
        const response = await fetch(apiUrl, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ input: parseInt(num) })
        });
        const result = await response.json();
        document.getElementById("primeResult").innerText =
            result ? `${num} is Prime ✅` : `${num} is NOT Prime ❌`;
        getRecords();
    }

    // GET: Fetch all records
    async function getRecords() {
        const response = await fetch(apiUrl);
        const records = await response.json();
        const tableBody = document.getElementById("recordsTable");
        tableBody.innerHTML = "";
        records.forEach(r => {
            const row = `<tr>
                <td>${r.id}</td>
                <td>${r.input}</td>
                <td>${r.output ? "✅" : "❌"}</td>
                <td>
                    <div class="action-buttons">
                        <button class="edit-btn" onclick="editRecord(${r.id}, ${r.input})">Edit</button>
                        <button class="delete-btn" onclick="deleteRecord(${r.id})">Delete</button>
                    </div>
                </td>
            </tr>`;
            tableBody.innerHTML += row;
        });
    }

    // PUT: Edit record (open prompt for new number)
    async function editRecord(id, oldNum) {
        const newNum = prompt("Enter new number:", oldNum);
        if (!newNum) return;
        await fetch(apiUrl, {
            method: "PUT",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ id: id, input: parseInt(newNum) })
        });
        getRecords();
    }

    // DELETE: Delete record
    async function deleteRecord(id) {
        if (!confirm("Are you sure you want to delete this record?")) return;
        await fetch(apiUrl, {
            method: "DELETE",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ id: parseInt(id) })
        });
        getRecords();
    }

    // Load records on page load
    window.onload = getRecords;
</script>
</body>
</html>
